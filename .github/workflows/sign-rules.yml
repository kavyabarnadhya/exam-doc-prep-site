# Signs and publishes exam rules prepared by the rules watcher.
# The watcher pushes rules/pending/rules.json to the rules-pending branch; this
# job checks it, signs it with the RULES_SIGNING_KEY secret, commits the signed
# file to main (GitHub Pages serves it to the app) and deletes the branch.
name: Sign rules

on:
  push:
    branches: [rules-pending]
    paths: [rules/pending/rules.json]

permissions:
  contents: write

concurrency:
  group: sign-rules
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography==47.0.0"
      - name: Take the prepared file from rules-pending
        run: git show origin/rules-pending:rules/pending/rules.json > "$RUNNER_TEMP/rules.json"
      - name: Check and sign
        env:
          RULES_SIGNING_KEY: ${{ secrets.RULES_SIGNING_KEY }}
        run: python tools/sign_rules.py "$RUNNER_TEMP/rules.json"
      - name: Publish to main and remove the pending branch
        run: |
          git config user.name "rules-signer"
          git config user.email "rules-signer@users.noreply.github.com"
          git add rules/v1/rules.json rules/v1/rules.json.sig
          git commit -m "Signed rules $(python -c 'import json;print(json.load(open("rules/v1/rules.json"))["version"])') (rules watcher)"
          git push origin main
          git push origin --delete rules-pending
