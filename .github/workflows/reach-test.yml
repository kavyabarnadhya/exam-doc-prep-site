# One-off test (17 Nov 2026): can GitHub's machines reach these exam sites?
# Deleted after the run.
name: Reach test
on: workflow_dispatch
permissions: {}
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - name: Try each site
        run: |
          for u in \
            https://exams.nta.ac.in/CUET-UG/ \
            https://nta.ac.in/ \
            https://cdnbbsr.s3waas.gov.in/s3d1a21da7bca4abff8b0b61b87597de73/uploads/2026/01/202601031633478370.pdf \
            https://upsc.gov.in/ \
            https://www.upsc.gov.in/sites/default/files/Notif-CSP-2026-Engl-060226Rev.pdf \
            https://rrb.indianrailways.gov.in/ \
            https://www.rrbcdg.gov.in/ \
            https://ssc.gov.in/ \
            https://jeemain.nta.nic.in/ ; do
            r=$(curl -sS -o /dev/null -L --max-time 30 -A "Mozilla/5.0" -w "%{http_code} %{size_download}B %{time_total}s" "$u" 2>&1) || true
            echo "RESULT $u -> $r"
          done
