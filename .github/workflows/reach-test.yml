# One-off test (17 Nov 2026): can machines outside India reach CTET's sites?
# Deleted after the run.
name: Reach test
on: workflow_dispatch
permissions: {}
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - name: Try each site
        run: |
          for u in \
            https://ctet.nic.in/ \
            https://ctet.nic.in/information-bulletin/ \
            https://cdnbbsr.s3waas.gov.in/s3443dec3062d0286986e21dc0631734c9/uploads/2026/05/202605111250310617.pdf \
            https://www.cbse.gov.in/ ; do
            r=$(curl -sS -o /dev/null -L --max-time 30 -A "ExamDocPrep-rules-watch" -w "%{http_code} %{size_download}B %{time_total}s" "$u" 2>&1) || true
            echo "RESULT $u -> $r"
          done
